name: Build and Push Themed Cap Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'theme.css'
      - 'standalone-assets.patch'
      - '.env.example'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract CAP_VERSION from .env.example
        id: get_version
        run: |
          if [ -f .env ]; then
            VERSION=$(grep -E '^CAP_VERSION=' .env | cut -d'=' -f2)
          elif [ -f .env.example ]; then
            VERSION=$(grep -E '^CAP_VERSION=' .env.example | cut -d'=' -f2)
          else
            VERSION="latest"
          fi
          
          if [ "$VERSION" = "latest" ]; then
            echo "Resolving latest standalone version..."
            VERSION=$(git ls-remote --tags --refs https://github.com/tiagozip/cap.git | grep -o 'refs/tags/standalone@[0-9.]*' | sort -V | tail -n1 | cut -d'@' -f2)
            if [ -z "$VERSION" ]; then
              VERSION="3.1.11"
            fi
          fi
          
          echo "CAP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found Cap version: $VERSION"

      - name: Set up QEMU (for multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Custom Cap Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CAP_VERSION=${{ steps.get_version.outputs.CAP_VERSION }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cap:standalone@${{ steps.get_version.outputs.CAP_VERSION }}-themed
            ${{ secrets.DOCKERHUB_USERNAME }}/cap:standalone@latest-themed
          cache-from: type=gha
          cache-to: type=gha,mode=max
