name: Build and Push Themed Cap Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'patch-dashboard.js'
      - 'standalone-assets.patch'
      - '.env.example'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract CAP_VERSION from .env.example
        id: get_version
        run: |
          if [ -f .env ]; then
            VERSION=$(grep -E '^CAP_VERSION=' .env | cut -d'=' -f2)
          elif [ -f .env.example ]; then
            VERSION=$(grep -E '^CAP_VERSION=' .env.example | cut -d'=' -f2)
          else
            VERSION="latest"
          fi
          
          if [ "$VERSION" = "latest" ]; then
            echo "Resolving latest standalone version..."
            VERSION=$(git ls-remote --tags --refs https://github.com/tiagozip/cap.git | grep -o 'refs/tags/standalone@[0-9.]*' | sort -V | tail -n1 | cut -d'@' -f2)
            if [ -z "$VERSION" ]; then
              VERSION="3.1.11"
            fi
          fi
          
          echo "CAP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found Cap version: $VERSION"

      - name: Set up QEMU (for multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub Credentials
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub (if secrets configured)
        if: steps.dockerhub_check.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construct Image Tags
        id: tags
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CAP_VER="${{ steps.get_version.outputs.CAP_VERSION }}"
          
          TAGS="ghcr.io/${REPO_OWNER}/cap-themed:${CAP_VER},ghcr.io/${REPO_OWNER}/cap-themed:latest"
          
          if [ "${{ steps.dockerhub_check.outputs.has_dockerhub }}" = "true" ]; then
            DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            TAGS="${TAGS},${DH_USER}/cap-themed:${CAP_VER},${DH_USER}/cap-themed:latest"
          fi
          
          echo "IMAGE_TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Custom Cap Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CAP_VERSION=${{ steps.get_version.outputs.CAP_VERSION }}
          push: true
          tags: ${{ steps.tags.outputs.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
